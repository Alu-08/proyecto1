<form class="row g-3">
  <div class="col-md-6">
    <label for="inputEmail4" class="form-label">Email</label>
    <input type="email" class="form-control" id="inputEmail4">
  </div>
  <div class="col-12">
    <label for="inputAddress" class="form-label">Direccion</label>
    <input type="text" class="form-control" id="inputAddress" placeholder="1234 Av.Alem">
  </div>
  <div class="col-12">
    <label for="inputAddress2" class="form-label">Piso</label>
    <input type="text" class="form-control" id="inputAddress2" placeholder="Departamento, estudio, piso">
  </div>
  <div class="col-md-6">
    <label for="inputCity" class="form-label">Ciudad</label>
    <input type="text" class="form-control" id="inputCity">
  </div>
  <div class="col-md-4">
    <label for="inputState" class="form-label">Provincia</label>
    <select id="inputState" class="form-select">
      <option selected>Elegir...</option>
      <option>Rio Negro</option>
      <option>Neuquen</option>
      <option>La pampa</option>
      <option>Chubut</option>

    </select>
  </div>
  <div class="col-12">
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="gridCheck">
      <label class="form-check-label" for="gridCheck">
        Acepto los términos y condiciones
      </label>
    </div>
  </div>
  <div class="col-12">
    <button type="submit" (click)="enviarFormulario()" class="btn btn-primary">Enviar</button>
  </div>
</form>
