<div class="cartasProd">
  @for(p of Productos; track p.id){
  @if(p.disponible){
  <div class="card mb-3" style="max-width: 540px;">
    <div class="row g-0" id="divimagen">
      <div class="col-md-4">
        <img id="imagen" src="assets/{{p.imagen}}" class="img-fluid rounded-start" alt="{{p.nombre}}">
      </div>
      <div class="col-md-8">
        <div class="card-body">
          <h5 class="card-title">{{p.nombre}}</h5>
          <p class="card-text">{{p.descripcion}}</p>
          <p>Precio: ${{p.precio}}</p>
          <button class="btn btn-primary" >Agregar al Carrito</button>
          <button class="btn btn-secondary" data-bs-toggle="modal" data-bs-target="#exampleModal">Ver Detalles</button>
        </div>
      </div>
    </div>
  </div>
  <!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Detalles del Producto</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>{{p.detalles}} </p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
  }
  }
</div>
