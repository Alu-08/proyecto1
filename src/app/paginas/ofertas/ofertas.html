<div class="cartasProd">
    @for(p of Ofertas; track p.id){
        @if(p.disponible){
            <div class="individual-card">
                <div class="divimagen">
                    <img src="assets/{{p.imagen}}" class="card-img-top" alt="Imagen de la oferta">
                </div>
                <div class="card-body">
                    <h5 class="card-title">{{p.nombre}}</h5>
                    <p class="card-text">{{p.detalles}}</p>
                    <p>Precio: ${{p.precio}}</p>
                    <button (click)= "agregarAFavoritos(p)">Agregar a favoritos</button>
                    <button (click)="agregarAlCarrito(p)">Agregar al carrito</button>
                </div>
            </div>
        }
    }
</div>
